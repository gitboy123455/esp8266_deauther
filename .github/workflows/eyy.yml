name: Build DSTIKE OLED Binary

on:
  push:
    branches: [ master, main, v2 ]
  pull_request:
    branches: [ master, main, v2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize indices (Silent Log Mode)
        run: |
          # Use --no-color to prevent logging display wrapper loops
          arduino-cli core update-index --config-file ./arduino-cli.yaml --no-color

      - name: Install Deauther Toolchain Package
        run: |
          # Explicitly install the custom Deauther core profile mapped inside the local yaml config
          arduino-cli core install deauther:esp8266 --config-file ./arduino-cli.yaml --no-color

      - name: Compile Custom DSTIKE OLED Target
        run: |
          # Using the exact core board name: deauther:esp8266:esp8266
          # Appends your -DDSTIKE_DEAUTHER_OLED preprocessor macro cleanly via extra flags
          arduino-cli compile \
            --config-file ./arduino-cli.yaml \
            --fqbn deauther:esp8266:esp8266:xtal=80,FlashMode=dout,FlashSize=4M1M,led=16 \
            --build-property "compiler.cpp.extra_flags=-DDSTIKE_DEAUTHER_OLED" \
            --output-dir ./build_dstike_oled \
            ./esp8266_deauther/esp8266_deauther.ino --no-color

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deauther-DSTIKE-OLED-Firmware
          path: ./build_dstike_oled/*.bin

