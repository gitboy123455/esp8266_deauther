name: Build DSTIKE OLED Binary

on:
  push:
    branches: [ master, main, v2 ]
  pull_request:
    branches: [ master, main, v2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Official ESP8266 Core Package
        run: |
          arduino-cli config init
          # Explicitly set the stable core URL alongside the legacy deauther dependency index
          arduino-cli config set board_manager.additional_urls http://esp8266.com
          
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Compile Custom DSTIKE OLED Target
        run: |
          # Use the generic ESP8266 engine mapping out 4MB Flash and DOUT constraints
          # Appends your -DDSTIKE_DEAUTHER_OLED preprocessor macro cleanly via extra flags
          arduino-cli compile \
            --fqbn esp8266:esp8266:generic:xtal=80,vt=flash,exception=disabled,ResetMethod=nodemcu,CrystalFreq=26,FlashFreq=40,FlashMode=dout,FlashSize=4M1M,led=2,sdk=221b,ip=lm2f,dbg=Disabled,lvl=None,wipe=none \
            --build-property "compiler.cpp.extra_flags=-DDSTIKE_DEAUTHER_OLED" \
            --output-dir ./build_dstike_oled \
            ./esp8266_deauther/esp8266_deauther.ino

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deauther-DSTIKE-OLED-Firmware
          path: ./build_dstike_oled/*.bin
